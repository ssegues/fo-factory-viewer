<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryOps Lab — warehouse</title>
<style>
  :root { --bg:#070b10; --panel:rgba(10,16,23,.86); --line:rgba(61,214,198,.35); --text:#dfe7ee; --dim:#8497a8; --accent:#3dd6c6; --warm:#ffa23d; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; }
  #stage, #labels { position:fixed; inset:0; } #labels { pointer-events:none; }
  .mono { font-family:Consolas,"Cascadia Mono",ui-monospace,monospace; }
  .hud { position:fixed; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(8px);
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
  .hud::before { content:""; position:absolute; left:0; top:0; width:42px; height:2px; background:var(--accent); }
  #top { top:16px; left:16px; padding:12px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; max-width:calc(100vw - 370px); }
  #top h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:1.6px; text-transform:uppercase; }
  #top small { color:var(--accent); display:block; font-size:11px; letter-spacing:1.4px; }
  #version { font-size:10px; font-weight:400; color:var(--dim); letter-spacing:.8px; margin-left:4px; }
  .nav { display:flex; } .nav a { color:var(--dim); text-decoration:none; border:1px solid rgba(140,170,190,.3); padding:10px 20px; font-size:14px; font-weight:600; letter-spacing:2px; text-transform:uppercase; }
  .nav a.on { background:rgba(61,214,198,.2); color:var(--accent); border-color:var(--accent); box-shadow:0 0 16px rgba(61,214,198,.3) inset; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { background:rgba(255,255,255,.03); color:var(--dim); border:1px solid rgba(140,170,190,.25); padding:7px 12px; font:inherit; font-size:12px; letter-spacing:1.2px; text-transform:uppercase; cursor:pointer; }
  .seg button.on { background:rgba(61,214,198,.18); color:var(--accent); border-color:var(--accent); box-shadow:0 0 14px rgba(61,214,198,.25) inset; }
  #refreshWork { background:rgba(61,214,198,.12); color:var(--accent); border:1px solid var(--line); padding:6px 10px; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-align:left; line-height:1.35; }
  #refreshWork small { display:block; color:var(--dim); font-size:10px; letter-spacing:.6px; text-transform:none; }
  #refreshWork:disabled { cursor:progress; opacity:.7; } #refreshWork.failed { color:var(--warm); border-color:rgba(255,162,61,.6); }
  #whSel { background:#0b1118; color:var(--accent); border:1px solid var(--line); padding:7px 8px; font-size:12px; }
  #hint { bottom:62px; left:16px; padding:9px 14px; color:var(--dim); font-size:13px; max-width:560px; }
  #detail { top:16px; right:16px; width:290px; padding:14px 16px 16px; }
  #detail .k { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:1.6px; }
  #detail h2 { margin:2px 0 10px; font-size:18px; font-weight:600; }
  #detail dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; }
  #detail dt { color:var(--dim); } #detail dd { margin:0; text-align:right; }
  #workPanel { top:150px; left:16px; width:330px; max-height:calc(100vh - 330px); padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  #workPanel[hidden] { display:none; }
  #workPanel .k { color:var(--accent); font-size:10px; text-transform:uppercase; letter-spacing:1.4px; }
  #workList { overflow:auto; display:flex; flex-direction:column; gap:4px; }
  #workList .work { display:grid; grid-template-columns:1fr auto; gap:1px 8px; text-align:left; background:rgba(255,255,255,.03); border:1px solid rgba(140,170,190,.18); color:var(--text); padding:6px 8px; cursor:pointer; font:inherit; font-size:12px; }
  #workList .work.on { border-color:var(--accent); background:rgba(61,214,198,.12); }
  #workList .work b { font-weight:600; font-family:Consolas,monospace; } #workList .work span { font-size:11px; text-transform:uppercase; letter-spacing:.8px; }
  #workList .work small { grid-column:1 / -1; color:var(--dim); }
  #legend { bottom:18px; left:16px; padding:8px 14px; font-size:12px; color:var(--dim); display:flex; gap:14px; flex-wrap:wrap; max-width:70vw; }
  #legend i { display:inline-block; width:8px; height:8px; margin-right:6px; }
  .lbl { white-space:nowrap; font-family:Consolas,"Cascadia Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.6px; background:rgba(7,11,16,.82); border:1px solid var(--line); border-left:3px solid var(--accent); padding:1px 7px; color:var(--text); }
  .lbl.area { border-left-color:var(--warm); color:var(--warm); text-transform:uppercase; }
  #demo { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--dim); letter-spacing:1.4px; text-transform:uppercase; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:var(--accent); letter-spacing:3px; text-transform:uppercase; font-size:13px; z-index:5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading" class="mono">Stacking shelves…</div>

<div id="top" class="hud">
  <div><h1>FactoryOps Lab <span id="version" class="mono"></span></h1><small class="mono" id="scope"></small></div>
  <div class="nav"><a id="navFactory" href="./">Factory</a><a class="on">Warehouse</a></div>

  <div class="k mono" id="d-kind">Selection</div>

</div>

<div id="workPanel" class="hud" hidden>
  <div class="k mono" id="workSource">Warehouse work · from the ERP</div>
  <div id="workList"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- data
// Structure comes from warehouses.json (locations, zones, profiles as set up in the ERP).
// Forklift movement is illustrative: warehouse work is not read yet, so trips are drawn between real
// locations of the right types, not replayed from real work. Box fill is decorative: stock is not read.
const params = new URLSearchParams(location.search);
const requested = params.get('data') ?? 'sample';
const dataset = /^[\w/-]+$/.test(requested) && !requested.includes('..') ? requested : 'sample';
document.getElementById('navFactory').href = `./?data=${dataset}`;
fetch('../package.json').then((r) => r.ok ? r.json() : null).catch(() => null).then((pkg) => { if (pkg?.version) document.getElementById('version').textContent = 'v' + pkg.version; });
const DATA = await fetch(`../data/${dataset}/warehouses.json`).then((r) => r.ok ? r.json() : null).catch(() => null);
if (!DATA) { document.getElementById('loading').textContent = `No warehouses.json in data/${dataset}`; throw new Error('Warehouse data missing'); }
const whSel = document.getElementById('whSel');
for (const w of [...DATA.warehouses].sort((a, b) => b.locations.length - a.locations.length)) whSel.add(new Option(`${w.id} · ${w.locations.length} location${w.locations.length === 1 ? '' : 's'}${w.work?.length ? ` · ${w.work.length} work` : ''}`, w.id));
const WH = DATA.warehouses.find((w) => w.id === params.get('wh')) ?? DATA.warehouses.find((w) => w.id === whSel.options[0].value);
whSel.value = WH.id;
whSel.addEventListener('change', () => { const u = new URL(location.href); u.searchParams.set('wh', whSel.value); location.href = u.toString(); });
document.getElementById('scope').textContent = `WAREHOUSE ${WH.id} // ${WH.locations.length} LOCATIONS`;

// Areas: locations grouped by location type (from the profile). Dock-side types sit on the apron; the rest is storage.
const DOCK = new Set(['BAYDOOR', 'RECV', 'STAGE', 'PACK', 'QMS', 'Return', 'SORT']);
const PICKING = new Set(['ORDER', 'FLOOR', 'WEBSHOP', 'FLOWRACK']);
const physical = WH.locations.filter((l) => l.type !== 'USER' && !(WH.advanced && !l.type && !l.aisle));
const skipped = WH.locations.length - physical.length;
const areaOf = (l) => l.type ?? (l.aisle ? 'Racked' : 'Locations');
const areas = {};
for (const l of physical) { const key = areaOf(l) + (l.aisle ? '' : '|flat'); (areas[key] ??= { type: areaOf(l), racked: Boolean(l.aisle), locations: [] }).locations.push(l); }
const blocks = Object.values(areas).filter((a) => !DOCK.has(a.type)).sort((a, b) => b.locations.length - a.locations.length);
const docks = Object.values(areas).filter((a) => DOCK.has(a.type)).flatMap((a) => a.locations).sort((a, b) => a.type.localeCompare(b.type));
const ZONE_COLOURS = [0x4cc9f0, 0xffd166, 0x9b5de5, 0x06d6a0, 0xff7b54, 0xf72585, 0x90be6d];
const zoneColour = {}; const colourOf = (l) => (zoneColour[l.zoneId ?? l.type ?? '—'] ??= ZONE_COLOURS[Object.keys(zoneColour).length % ZONE_COLOURS.length]);

// ---------------------------------------------------------------- renderer
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1; stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070b10); scene.fog = new THREE.Fog(0x070b10, 130, 330);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.4;
const camera = new THREE.PerspectiveCamera(27, 1, 1, 900);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = 1.3; controls.minDistance = 16;
scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x0a0f15, 0.7));
const sun = new THREE.DirectionalLight(0xffe9cf, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04; scene.add(sun);
const rim = new THREE.DirectionalLight(0x3dd6c6, 0.6); rim.position.set(-40, 20, -30); scene.add(rim);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.6, 1.7)); composer.addPass(new OutputPass());

// ---------------------------------------------------------------- textures, materials, helpers
function canvasTexture(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hash = (text) => { let h = 2166136261; for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
const concrete = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = '#39414b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.07)'; const s = 1 + rnd() * 3; g.fillRect(rnd() * w, rnd() * h, s, s); }
  g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 3; for (const p of [0, 256]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
});
const hazard = canvasTexture(64, 64, (g) => { g.fillStyle = '#f2b705'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#15181c'; for (let i = -64; i < 128; i += 32) { g.beginPath(); g.moveTo(i, 64); g.lineTo(i + 16, 64); g.lineTo(i + 80, 0); g.lineTo(i + 64, 0); g.fill(); } });
const chevron = canvasTexture(128, 64, (g) => { g.clearRect(0, 0, 128, 64); g.strokeStyle = '#3dd6c6'; g.lineWidth = 9; g.lineCap = 'square'; for (const x of [20, 84]) { g.beginPath(); g.moveTo(x, 10); g.lineTo(x + 24, 32); g.lineTo(x, 54); g.stroke(); } });
function floorTag(text, colour, w = 384, h = 224) {
  return canvasTexture(w, h, (g) => {
    g.clearRect(0, 0, w, h); g.globalAlpha = 0.13; g.fillStyle = colour; g.fillRect(8, 8, w - 16, h - 16); g.globalAlpha = 1;
    g.strokeStyle = colour; g.lineWidth = 8; g.setLineDash([24, 12]); g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = colour; g.font = `700 ${text.length > 9 ? 44 : 60}px Consolas,monospace`; g.textBaseline = 'middle'; g.fillText(text.slice(0, 14), 24, h - 46);
  }, false);
}
function paintedText(text, height, colour = '#dfe7ee', opacity = 0.6) {
  const tex = canvasTexture(1024, 128, (g) => { g.font = '700 84px "Segoe UI",sans-serif'; g.textBaseline = 'middle'; g.fillStyle = colour; g.fillText(text.toUpperCase(), 8, 68); }, false);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(height * 8, height), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.geometry.translate(height * 4, 0, 0); return m;
}
const std = (color, roughness = 0.6, metalness = 0.2, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const M = { steel: std(0xaeb7c2, 0.38, 0.75), graphite: std(0x2a3038, 0.55, 0.45), dark: std(0x1b2028, 0.6, 0.5), orange: std(0xff8a2a, 0.45, 0.25), yellow: std(0xf2b705, 0.55, 0.1),
  carton: std(0xb98a56, 0.9, 0), blue: std(0x2f6fde, 0.6, 0.1), rubber: std(0x101216, 0.9, 0), white: std(0xe6e2d9, 0.5, 0.15), wood: std(0x9a7448, 0.8, 0), teal: std(0x1f8f86, 0.5, 0.3) };
const glow = (hex, intensity = 3) => std(0x111111, 0.4, 0, { emissive: hex, emissiveIntensity: intensity });
function box(w, h, d, mat, x = 0, y = 0, z = 0, r = 0.05) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 16) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); m.castShadow = true; return m; }
function label(text, cls = '') { const el = document.createElement('div'); el.className = 'lbl ' + cls; el.textContent = text; return new CSS2DObject(el); }
function flat(w, d, map, x, z, y = 0.075) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); return m; }
function palletLoad(g, x, z, n, y = 0) { g.add(box(1.3, 0.14, 1.3, M.wood, x, y + 0.07, z, 0.02)); for (let k = 0; k < n; k++) g.add(box(1.1, 0.7, 1.1, M.carton, x, y + 0.5 + k * 0.72, z, 0.04)); }

// ---------------------------------------------------------------- layout from the structure
// Racked areas: one rack row per aisle, bays along the row by rack number, shelves upward, bins side by side.
// Flat areas: a grid of floor bays. Dock-side locations line the apron on the left. No coordinate comes from the data.
const hall = new THREE.Group(); scene.add(hall);
const ROW = 4.6, BAY = 1.7, LEVEL_H = 1.15, DEPTH = 1.25, CROSS = 4.5, CELL_X = 2.9, CELL_Z = 2.6;
const place = {};                               // location id -> { pos, access, location }
const pickables = [], slots = [];
let cursor = 13, minZ = -8;
const blockInfo = [];
for (const block of blocks) {
  const x0 = cursor;
  if (block.racked) {
    const aisles = [...new Set(block.locations.map((l) => l.aisle))].sort();
    const racks = Math.max(...block.locations.map((l) => l.rack)), levels = Math.max(...block.locations.map((l) => l.shelf)), bins = Math.max(...block.locations.map((l) => l.bin));
    aisles.forEach((aisle, i) => {
      const x = x0 + i * ROW + DEPTH / 2;
      for (const l of block.locations.filter((q) => q.aisle === aisle)) {
        const z = -(l.rack - 0.5) * BAY + (l.bin - (bins + 1) / 2) * (BAY / bins);
        place[l.id] = { location: l, pos: new THREE.Vector3(x, 0.22 + (l.shelf - 1) * LEVEL_H, z), access: new THREE.Vector3(x + DEPTH / 2 + 1.55, 0, -(l.rack - 0.5) * BAY), size: [DEPTH * 0.82, (BAY / bins) * 0.84] };
      }
      const len = racks * BAY;
      for (let r = 0; r <= racks; r++) for (const dx of [-DEPTH / 2, DEPTH / 2]) hall.add(box(0.08, levels * LEVEL_H + 0.3, 0.08, M.orange, x + dx, (levels * LEVEL_H + 0.3) / 2, -r * BAY, 0.01));
      for (let s = 0; s < levels; s++) for (const dx of [-DEPTH / 2, DEPTH / 2]) hall.add(box(0.07, 0.1, len, M.blue, x + dx, 0.14 + s * LEVEL_H, -len / 2, 0.01));
      const tag = label(`AISLE ${aisle}`); tag.position.set(x, levels * LEVEL_H + 1.0, 0.4); hall.add(tag);
    });
    cursor = x0 + aisles.length * ROW; minZ = Math.min(minZ, -racks * BAY - 3);
    blockInfo.push({ block, x0, x1: cursor - (ROW - DEPTH - 0.4), text: `${block.type} · ${aisles.length} aisles × ${racks} racks × ${levels} shelves` });
  } else {
    const n = block.locations.length, cols = Math.min(8, Math.ceil(Math.sqrt(n * 1.4)));
    block.locations.sort((a, b) => a.id.localeCompare(b.id, 'en', { numeric: true })).forEach((l, i) => {
      const x = x0 + (i % cols) * CELL_X + CELL_X / 2, z = -Math.floor(i / cols) * (CELL_Z + 1.4) - CELL_Z / 2 - 0.6;
      place[l.id] = { location: l, pos: new THREE.Vector3(x, 0.03, z), access: new THREE.Vector3(x, 0, z + CELL_Z / 2 + 0.9), floor: true, size: [CELL_X - 0.5, CELL_Z - 0.4] };
      hall.add(flat(CELL_X - 0.4, CELL_Z - 0.3, floorTag(l.id, '#' + colourOf(l).toString(16).padStart(6, '0')), x, z));
    });
    cursor = x0 + cols * CELL_X; minZ = Math.min(minZ, -Math.ceil(n / cols) * (CELL_Z + 1.4) - 3);
    blockInfo.push({ block, x0, x1: cursor, text: `${block.type} · ${n} floor location${n === 1 ? '' : 's'}` });
  }
  cursor += 4;
}
docks.forEach((l, i) => {
  const z = -i * 5.6 - 2.6; minZ = Math.min(minZ, z - 5);
  place[l.id] = { location: l, pos: new THREE.Vector3(5, 0.03, z), access: new THREE.Vector3(9.6, 0, z), floor: true, dock: true, size: [6.6, 4.4] };
  hall.add(flat(7, 4.8, floorTag(l.id, l.type === 'BAYDOOR' ? '#ffa23d' : '#7ff0e3', 448, 300), 5, z));
});
const W = Math.max(cursor, 30), zc = CROSS, maxZ = CROSS + 5.5, D = maxZ - minZ;
hall.position.set(-W / 2, 0, -(minZ + maxZ) / 2);

// Floor, cross aisle, walls.
{
  const map = concrete.clone(); map.needsUpdate = true; map.repeat.set(W / 8, D / 8);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 4, 0.24, D), std(0x8e98a4, 0.92, 0.05, { map })); slab.position.set(W / 2, -0.12, (minZ + maxZ) / 2); slab.receiveShadow = true; hall.add(slab);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), std(0x1a2028, 0.95, 0)); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.24; ground.receiveShadow = true; scene.add(ground);
  const stripe = (len, x, z, rot = 0) => { const m = hazard.clone(); m.needsUpdate = true; m.repeat.set(len / 0.64, 1); const s = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.3), std(0xffffff, 0.75, 0, { map: m })); s.rotation.x = -Math.PI / 2; s.rotation.z = rot; s.position.set(x, 0.012, z); hall.add(s); };
  stripe(W - 10, W / 2 + 4, zc - 2.3); stripe(W - 10, W / 2 + 4, zc + 2.3); stripe(D - 2, 10.2, (minZ + maxZ) / 2, Math.PI / 2);
  const title = paintedText(`Warehouse ${WH.id}`, 1.5, '#e9eef3', 0.5); title.position.set(12, 0.02, maxZ - 1.6); hall.add(title);
  for (const b of blockInfo) { const t = paintedText(b.text, 0.75, '#7ff0e3', 0.8); t.position.set(b.x0, 0.02, 1.1); hall.add(t); }

  const hit = ray.intersectObjects(pickables, false)[0]; if (!hit || hit.instanceId == null) { ring.visible = false; return; }
  const e2 = slots[hit.instanceId], l = e2.location;
  document.getElementById('d-kind').textContent = 'Warehouse location'; document.getElementById('d-title').textContent = `${WH.id} / ${l.id}`;
  const rows = [['Location type', l.type ?? '—'], ['Zone', l.zoneId ? `${l.zoneId}${DATA.zones[l.zoneId]?.name && DATA.zones[l.zoneId].name !== l.zoneId ? ' · ' + DATA.zones[l.zoneId].name : ''}` : '—'], ['Profile', l.profileId ?? '—'],
    ['Aisle / rack / shelf / bin', l.aisle ? `${l.aisle} / ${l.rack} / ${l.shelf} / ${l.bin}` : '—'], ['Position read from', l.positionFrom === 'location-id' ? 'the location ID' : l.positionFrom ? 'location fields' : '—'],
    ['Default for', l.defaultFor.join(', ') || '—'], ['Fixed items', l.fixedItems.join(', ') || '—']];
  const body = document.getElementById('d-body'); body.replaceChildren();
  for (const [k, v] of rows) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; body.append(dt, dd); }
  ring.position.set(e2.pos.x, e2.pos.y + 0.06, e2.pos.z); ring.visible = true;
});
// Keep the work list below the header, which wraps on narrow screens.
const placeWorkPanel = () => { document.getElementById('workPanel').style.top = `${Math.round(document.getElementById('top').getBoundingClientRect().bottom + 10)}px`; };
function resize() { placeWorkPanel(); const w = innerWidth, h = innerHeight; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h); }
addEventListener('resize', resize); resize(); setFlow(params.get('flow') ?? (WORK.length ? 'work' : 'structure'));
document.getElementById('loading').remove();
const timer = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(timer.getDelta(), 0.05);
  if (flow) stepFlow(dt);
  if (workTruck) stepWork(dt);
  ring.rotation.z += dt * 0.5; controls.update(); composer.render(); labelRenderer.render(scene, camera);
});
