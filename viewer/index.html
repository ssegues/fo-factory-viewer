<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryOps Lab — visual prototype</title>
<style>
  :root { --bg:#070b10; --panel:rgba(11,17,24,.9); --line:rgba(90,200,190,.35); --text:#e6edf3; --dim:#8b9bab; --accent:#3dd6c6; --warm:#ffa23d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #stage, #labels { position:fixed; inset:0; }
  #labels { pointer-events:none; }
  .mono { font-family:Consolas,"Cascadia Mono",ui-monospace,monospace; }
  .hud { position:fixed; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(8px);
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
  .hud::before { content:""; position:absolute; left:0; top:0; width:42px; height:2px; background:var(--accent); }
  #top { top:16px; left:16px; padding:12px 16px; display:flex; gap:16px; align-items:center; }
  #top h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:1.6px; text-transform:uppercase; }
  #top small { color:var(--accent); display:block; font-size:11px; letter-spacing:1.4px; }
  .seg { display:flex; gap:6px; }
  .seg button { background:rgba(255,255,255,.03); color:var(--dim); border:1px solid rgba(140,170,190,.25); padding:7px 14px; font:inherit; font-size:12px; letter-spacing:1.4px; text-transform:uppercase; cursor:pointer; }
  .seg button.on { background:rgba(61,214,198,.18); color:var(--accent); border-color:var(--accent); box-shadow:0 0 14px rgba(61,214,198,.25) inset; }
  #routeSel { background:rgba(255,255,255,.04); color:var(--accent); border:1px solid var(--line); padding:6px 8px; font-size:12px; max-width:240px; }
  #routeSel option { background:#0b1118; color:var(--text); }
  #hint { top:86px; left:16px; padding:9px 14px; color:var(--dim); font-size:13px; max-width:540px; }
  #detail { top:16px; right:16px; width:290px; padding:14px 16px 16px; }
  #detail .k { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:1.6px; }
  #detail h2 { margin:2px 0 10px; font-size:18px; font-weight:600; }
  #detail dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; }
  #detail dt { color:var(--dim); } #detail dd { margin:0; text-align:right; }
  #timeline { bottom:18px; left:50%; transform:translateX(-50%); padding:10px 16px; display:none; gap:12px; align-items:center; width:min(720px,calc(100vw - 32px)); }
  #timeline button { background:rgba(61,214,198,.16); color:var(--accent); border:1px solid var(--line); padding:6px 12px; font:inherit; font-size:12px; letter-spacing:1.2px; text-transform:uppercase; cursor:pointer; min-width:72px; }
  #timeline input { flex:1; accent-color:var(--accent); }
  #clock { font-size:15px; min-width:52px; white-space:nowrap; text-align:right; color:var(--accent); }
  #legend { bottom:18px; left:16px; padding:8px 14px; font-size:12px; color:var(--dim); display:flex; gap:14px; }
  #legend i { display:inline-block; width:8px; height:8px; margin-right:6px; box-shadow:0 0 8px currentColor; }
  .lbl { white-space:nowrap; font-family:Consolas,"Cascadia Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.6px; }
  .lbl.res { background:rgba(7,11,16,.82); border:1px solid var(--line); border-left:3px solid var(--accent); padding:1px 7px; color:var(--text); }
  .lbl.op { color:#06110f; background:var(--accent); padding:1px 7px; font-weight:700; }
  .lbl.op.assist { background:var(--warm); }
  .lbl.order { background:rgba(7,11,16,.85); padding:1px 7px; border:1px solid currentColor; }
  .lbl.pad { color:var(--warm); border:1px solid rgba(255,162,61,.5); background:rgba(7,11,16,.8); padding:1px 7px; text-transform:uppercase; }
  #demo { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--dim); letter-spacing:1.4px; text-transform:uppercase; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:var(--accent); letter-spacing:3px; text-transform:uppercase; font-size:13px; z-index:5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading" class="mono">Assembling factory…</div>

<div id="top" class="hud">
  <div><h1>FactoryOps Lab</h1><small class="mono" id="scope"></small></div>
  <div class="seg" id="modes">
    <button data-mode="structure">Floor</button>
    <button data-mode="route" class="on">Route</button>
    <button data-mode="orders">Orders</button>
  </div>
  <select id="routeSel" class="mono" aria-label="Route"></select>
</div>
<div id="hint" class="hud"></div>
<div id="demo" class="mono">Illustrative data · visual prototype</div>

<div id="detail" class="hud">
  <div class="k mono" id="d-kind">Selection</div>
  <h2 id="d-title">Click a resource</h2>
  <dl id="d-body"><dt>Tip</dt><dd>Drag to orbit, scroll to zoom</dd></dl>
</div>

<div id="timeline" class="hud">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="480" step="any" value="0" />
  <span id="clock" class="mono">06:00</span>
</div>
<div id="legend" class="hud mono">
  <span><i style="background:#3ddc84;color:#3ddc84"></i>RUNNING</span>
  <span><i style="background:#5b7a99;color:#5b7a99"></i>IDLE</span>
  <span><i style="background:#ffa23d;color:#ffa23d"></i>WIP</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- data
// The viewer never talks to the ERP. It reads a snapshot (the manufacturing model as extracted)
// and a local visuals file (which 3D model stands for which resource). `?data=<folder>` picks the set.
const requested = new URLSearchParams(location.search).get('data') ?? 'sample';
const dataset = /^[\w/-]+$/.test(requested) && !requested.includes('..') ? requested : 'sample';
async function loadJson(name) { const r = await fetch(`../data/${dataset}/${name}.json`); return r.ok ? r.json() : null; }
const [SNAP, VISUALS] = await Promise.all([loadJson('snapshot'), loadJson('visuals')]);
if (!SNAP) { document.getElementById('loading').textContent = `No snapshot found in data/${dataset}`; throw new Error('Snapshot missing'); }

const isPerson = (r) => r.type === 'Personnel';
const byId = Object.fromEntries(SNAP.resources.map((r) => [r.id, r]));
const rawRoutes = SNAP.routes ?? [];
const primaryIds = new Set(rawRoutes.flatMap((r) => r.operations.flatMap((o) => o.eligibleResourceIds ?? [])));
// A person who is the primary resource of an operation gets a manual workstation of their own.
// A person who only ever assists (secondary operations) stands next to the machine they assist.
const workerAt = {};
for (const route of rawRoutes) for (const op of route.operations) for (const sec of op.secondary ?? []) {
  const hosts = (op.eligibleResourceIds ?? []).filter((id) => byId[id] && !isPerson(byId[id]));
  (sec.eligibleResourceIds ?? []).forEach((id, i) => {
    const person = byId[id]; if (!person || !isPerson(person) || primaryIds.has(id) || !hosts.length) return;
    if (!Object.values(workerAt).includes(person)) workerAt[hosts[i % hosts.length]] ??= person;
  });
}
const assistants = new Set(Object.values(workerAt).map((p) => p.id));
const stations = SNAP.resources.filter((r) => !assistants.has(r.id));
const stationIds = new Set(stations.map((r) => r.id));
function modelFor(r) {
  if (VISUALS?.byResource?.[r.id]) return VISUALS.byResource[r.id];
  if (isPerson(r)) return 'bench';
  if (r.type === 'Vendor') return 'vendor';
  return (r.capabilities ?? []).map((c) => VISUALS?.byCapability?.[c]).find(Boolean) ?? VISUALS?.fallback ?? 'press';
}
const SITE = { units: SNAP.productionUnits.map((u) => ({ ...u,
  groups: SNAP.resourceGroups.filter((g) => g.productionUnitId === u.id).sort((a, b) => a.id.localeCompare(b.id)).map((g) => ({ ...g,
    resources: stations.filter((r) => r.groupId === g.id).map((r) => ({ ...r, model: modelFor(r), worker: workerAt[r.id] })) })).filter((g) => g.resources.length),
})).filter((u) => u.groups.length) };
const hiddenGroups = SNAP.resourceGroups.length - SITE.units.reduce((n, u) => n + u.groups.length, 0);
const ROUTES = rawRoutes.map((r) => {
  const longest = Math.max(0, ...r.operations.map((o) => o.runHoursPerUnit ?? 0));
  return { id: r.id, name: r.name, product: r.productId,
    ops: r.operations.map((o) => ({ no: o.number, name: o.name, hours: o.runHoursPerUnit ?? 0,
      alternatives: (o.eligibleResourceIds ?? []).filter((id) => stationIds.has(id)),
      assistants: (o.secondary ?? []).map((s) => (s.eligibleResourceIds ?? []).filter((id) => byId[id])).filter((s) => s.length),
      needs: [...(o.requirement?.capabilities ?? []).map((c) => c.name), o.requirement?.resourceType].filter(Boolean).join(' + '),
      dwell: longest ? 2 + 4 * ((o.runHoursPerUnit ?? 0) / longest) : 3 })).filter((o) => o.alternatives.length) };
}).filter((r) => r.ops.length);
const PALETTE = [0x4cc9f0, 0xf72585, 0xffd166, 0x9b5de5, 0x06d6a0, 0xff7b54, 0x90be6d, 0xf9844a];
const rawOrders = SNAP.productionOrders ?? [];
const DATED = rawOrders.some((o) => (o.jobs ?? []).some((j) => typeof j.start === 'string'));
const stamps = rawOrders.flatMap((o) => (o.jobs ?? []).flatMap((j) => [j.start, j.end])).filter(Boolean);
const T0 = DATED ? Math.min(...stamps.map((x) => Date.parse(x + 'Z'))) - 12 * 3.6e6 : 0;
const clockOf = (x) => (DATED ? (Date.parse(x + 'Z') - T0) / 3.6e6 : x);          // hours for ERP data, minutes for the sample
const TRAVEL = DATED ? 10 : 15, MIN_BUSY = DATED ? 8 : 0;
const productColour = {};
const ORDERS = rawOrders.map((o) => {
  const jobs = (o.jobs ?? []).filter((j) => j.start != null && j.resourceId).map((j) => ({ primary: !j.priority || j.priority === 'Primary', row: [j.resourceId, clockOf(j.start), clockOf(j.end ?? j.start)] }));
  productColour[o.productId] ??= PALETTE[Object.keys(productColour).length % PALETTE.length];
  return { id: o.id, product: o.productId, colour: productColour[o.productId],
    jobs: jobs.filter((j) => j.primary).map((j) => j.row).sort((x, y) => x[1] - y[1]), assists: jobs.filter((j) => !j.primary).map((j) => j.row),
    rows: [['Product', o.productId ?? '—'], ['Status', o.status ?? '—'], ['Quantity', o.quantity ?? '—'], ['Route', o.routeId ?? '—'], ['Scheduled start', (o.scheduledStart ?? '—').replace('T', ' ')], ['Scheduled end', (o.scheduledEnd ?? '—').replace('T', ' ')], ['Delivery', o.deliveryDate ?? '—']] };
});
const DAY = DATED ? Math.max(24, ...ORDERS.flatMap((o) => o.jobs.map((j) => j[2]))) + 24 : SNAP.schedule?.minutes ?? 480;
const DAY_START = (() => { const [h, m] = (SNAP.schedule?.startLabel ?? '06:00').split(':').map(Number); return h * 60 + m; })();
function clockLabel(t) {
  if (DATED) return new Date(T0 + t * 3.6e6).toISOString().slice(0, 16).replace('T', ' ');
  const total = DAY_START + Math.round(t); return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
}
document.getElementById('scope').textContent = `${SNAP.meta?.company ?? ''} // SITE ${SNAP.meta?.site ?? ''}`;
document.getElementById('demo').textContent = SNAP.meta?.source === 'sample' ? 'Illustrative data · sample snapshot'
  : `D365FO snapshot · ${SNAP.meta?.company} site ${SNAP.meta?.site} · effective ${SNAP.meta?.effectiveDate ?? ''}` + (hiddenGroups ? ` · ${hiddenGroups} empty groups hidden` : '');

// ---------------------------------------------------------------- renderer
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b10);
scene.fog = new THREE.Fog(0x070b10, 130, 330);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.38;

const camera = new THREE.PerspectiveCamera(27, 1, 1, 600);
camera.position.set(58, 52, 74);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.3; controls.minDistance = 22; controls.maxDistance = 170;
controls.target.set(1, 1.5, 1);

scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x0a0f15, 0.5));
const sun = new THREE.DirectionalLight(0xffe9cf, 2.2);
sun.position.set(34, 62, 40); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 220 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x3dd6c6, 0.6); rim.position.set(-40, 20, -30); scene.add(rim);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.6, 1.7));
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- textures
function canvasTexture(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const concrete = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = '#39414b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.07)'; const s = 1 + rnd() * 3; g.fillRect(rnd() * w, rnd() * h, s, s); }
  for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(0,0,0,.06)'; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 20 + rnd() * 50, 10 + rnd() * 30, rnd() * 3, 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 3;
  for (const p of [0, 256]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
  for (const p of [3, 259]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
});
const hazard = canvasTexture(64, 64, (g) => {
  g.fillStyle = '#f2b705'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#15181c';
  for (let i = -64; i < 128; i += 32) { g.beginPath(); g.moveTo(i, 64); g.lineTo(i + 16, 64); g.lineTo(i + 80, 0); g.lineTo(i + 64, 0); g.fill(); }
});
const wallPanel = canvasTexture(256, 256, (g) => {
  g.fillStyle = '#27303a'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2500; i++) { g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.08)'; g.fillRect(rnd() * 256, rnd() * 256, 2, 2 + rnd() * 8); }
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 4; g.strokeRect(2, 2, 252, 252);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 150, 256, 6);
  g.fillStyle = '#5c6a78'; for (const [x, y] of [[14, 14], [242, 14], [14, 242], [242, 242], [128, 14], [128, 242]]) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
});
const chevron = canvasTexture(128, 64, (g) => {
  g.clearRect(0, 0, 128, 64); g.strokeStyle = '#3dd6c6'; g.lineWidth = 9; g.lineCap = 'square';
  for (const x of [20, 84]) { g.beginPath(); g.moveTo(x, 10); g.lineTo(x + 24, 32); g.lineTo(x, 54); g.stroke(); }
});
function paintedText(text, height, colour = '#dfe7ee', opacity = 0.5) {
  const tex = canvasTexture(1024, 128, (g) => { g.font = '700 92px "Segoe UI",sans-serif'; g.textBaseline = 'middle'; g.fillStyle = colour; g.fillText(text.toUpperCase(), 8, 68); g.userData = g.measureText(text.toUpperCase()).width; }, false);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(height * 8, height), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.geometry.translate(height * 4, 0, 0); return m;
}

// ---------------------------------------------------------------- materials and helpers
const std = (color, roughness = 0.6, metalness = 0.2, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const M = {
  steel: std(0xaeb7c2, 0.38, 0.75), white: std(0xe6e2d9, 0.5, 0.15), graphite: std(0x2a3038, 0.55, 0.45), dark: std(0x1b2028, 0.6, 0.5),
  orange: std(0xff8a2a, 0.45, 0.25), yellow: std(0xf2b705, 0.55, 0.1), carton: std(0xb98a56, 0.9, 0), blue: std(0x2f6fde, 0.6, 0.1), teal: std(0x1f8f86, 0.5, 0.3),
  skin: std(0xe8b796, 0.8, 0), boot: std(0x1b1d22, 0.8, 0), vest: std(0xff7a1a, 0.7, 0), rubber: std(0x101216, 0.9, 0),
  hazard: std(0xffffff, 0.7, 0, { map: hazard }), display: std(0x06202a, 0.3, 0, { emissive: 0x35c8e8, emissiveIntensity: 1.6 }),
};
Object.assign(M, { wood: std(0x9a7448, 0.8, 0), cabinet: std(0x3a2c22, 0.55, 0.1), tealDark: std(0x176f68, 0.6, 0.3) });
const glow = (hex, intensity = 3) => std(0x111111, 0.4, 0, { emissive: hex, emissiveIntensity: intensity });
function box(w, h, d, mat, x = 0, y = 0, z = 0, r = 0.06) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function slab(w, d, h, y, tint, tile = 8) {
  const map = concrete.clone(); map.needsUpdate = true; map.repeat.set(w / tile, d / tile);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(tint, 0.92, 0.05, { map }));
  m.position.y = y - h / 2; m.receiveShadow = true; return m;
}
function stripe(len, wide = 0.32) {
  const map = hazard.clone(); map.needsUpdate = true; map.repeat.set(len / (wide * 2), 1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, wide), std(0xffffff, 0.75, 0, { map }));
  m.rotation.x = -Math.PI / 2; m.receiveShadow = true; return m;
}
function border(group, w, d, x, y, z) {
  for (const [len, px, pz, rot] of [[w, 0, -d / 2, 0], [w, 0, d / 2, 0], [d, -w / 2, 0, Math.PI / 2], [d, w / 2, 0, Math.PI / 2]]) {
    const s = stripe(len); s.position.set(x + px, y, z + pz); s.rotation.z = rot; group.add(s);
  }
}
function label(text, cls, anchorX = 0.5) {
  const el = document.createElement('div'); el.className = 'lbl ' + cls; el.textContent = text;
  const o = new CSS2DObject(el); o.center.set(anchorX, 0.5); return o;
}

// ---------------------------------------------------------------- machines
// Three families use the project's own Blender models, exported to glTF. Parts are found by
// name and re-parented under pivots so they can move. Press and inspection are placeholders.
const SCALE = 1.3;
const MODELS = {};
const loader = new GLTFLoader();
await Promise.all([['cnc', 'cnc'], ['robot', 'robot'], ['pack', 'packaging']].map(async ([key, file]) => {
  const gltf = await loader.loadAsync(`models/${file}.glb`);
  const drop = []; gltf.scene.traverse((o) => { if (/^Plane$|shadow_catcher/.test(o.name)) drop.push(o); });
  drop.forEach((o) => o.removeFromParent());
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = !o.material.transparent; o.receiveShadow = true; } });
  MODELS[key] = gltf.scene;
}));
function instance(key) { const root = MODELS[key].clone(true); root.scale.setScalar(SCALE); root.updateMatrixWorld(true); return root; }
function rig(root, pattern, x = 0, y = 0, z = 0) {
  const pivot = new THREE.Group(); pivot.position.set(x, y, z); root.add(pivot); root.updateMatrixWorld(true);
  const parts = []; root.traverse((o) => { if (o.isMesh && pattern.test(o.name)) parts.push(o); });
  parts.forEach((o) => pivot.attach(o)); return pivot;
}

  if (!o.jobs.length) return;
  const slot = new THREE.Vector3(3.8 + (n % 2) * 1.6, 0, ((n % 6) - 2.5) * 1.5);
  const stops = [RAW.clone().add(slot), ...o.jobs.map((j) => front(j[0])), FIN.clone().add(new THREE.Vector3(-slot.x, 0, slot.z))];
  o.curves = stops.slice(0, -1).map((s, i) => curve(s, stops[i + 1]));
});
function placeOrders(t) {
  for (const id in machines) machines[id].active = 0;
  const waiting = {};
  for (const o of ORDERS) {
    const jobs = o.jobs, last = jobs.length - 1;
    if (!jobs.length) continue;
    const busyUntil = (j) => Math.max(j[2], j[1] + MIN_BUSY), first = jobs[0][1], done = busyUntil(jobs[last]);
    o.mesh.visible = t >= first - TRAVEL && t <= done + TRAVEL;
    if (!o.mesh.visible) continue;
    let pos;
    if (t < first) pos = o.curves[0].getPoint(ease((t - (first - TRAVEL)) / TRAVEL));
    else if (t >= done) pos = o.curves[last + 1].getPoint(ease((t - done) / TRAVEL));
    else {
      let k = 0; while (k < last && jobs[k + 1][1] <= t) k++;
      const next = k < last ? jobs[k + 1][1] : Infinity;
      const leave = k < last ? next - Math.min(TRAVEL, (next - jobs[k][1]) * 0.5) : Infinity;
      if (t >= leave) pos = o.curves[k + 1].getPoint(ease((t - leave) / (next - leave)));
      else { pos = o.curves[k].getPoint(1); (waiting[jobs[k][0]] ??= []).push(o); if (t <= busyUntil(jobs[k])) machines[jobs[k][0]].active++; }
    }
    o.mesh.position.copy(pos);
    for (const a of o.assists) if (t >= a[1] && t <= busyUntil(a)) machines[a[0]].active++;
  }
  for (const id in waiting) waiting[id].forEach((o, i, all) => { o.mesh.position.x += (i - (all.length - 1) / 2) * 1.5; o.mesh.position.z += (i % 2) * 0.9; });
}

// ---------------------------------------------------------------- modes and interface
const hints = {
  structure: 'The floor is generated from the ERP hierarchy: production units contain resource groups, groups contain resources.',
  orders: ORDERS.length ? ORDERS.filter((o) => o.jobs.length).length + ' production orders replayed against their scheduled jobs. Markers are coloured by product. Drag the timeline or let it play.' : 'This snapshot has no production orders yet.',
};
let mode = 'route', minutes = 0, playing = true;
const routeSel = document.getElementById('routeSel');
for (const r of ROUTES) routeSel.add(new Option(`${r.id} · ${r.product} · ${r.name ?? ''}`, r.id));
routeSel.addEventListener('change', () => setMode('route'));
const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), playBtn = document.getElementById('play');
function setMode(next) {
  mode = next;
  buildRoute(mode === 'route' ? ROUTES[routeSel.selectedIndex] ?? ROUTES[0] : null);
  routeSel.style.display = mode === 'route' && ROUTES.length > 1 ? '' : 'none';
  document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('hint').textContent = mode === 'route' ? describeRoute(ROUTE) : hints[mode];
  document.getElementById('timeline').style.display = mode === 'orders' ? 'flex' : 'none';
  document.getElementById('legend').style.display = mode === 'orders' ? 'none' : 'flex';
  routeLayer.visible = mode === 'route'; ordersLayer.visible = mode === 'orders';
  clearRoute(); for (const id in machines) machines[id].active = 0;
}
document.querySelectorAll('#modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; });
scrub.addEventListener('input', () => { minutes = Number(scrub.value); });

const ring = new THREE.Mesh(new THREE.RingGeometry(3.7, 3.95, 4, 1), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x3dd6c6).multiplyScalar(2.5), side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.rotation.z = Math.PI / 4; ring.visible = false; world.add(ring);
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(pickables.filter((p) => p.visible && p.parent.visible), true)[0];
  let o = hit?.object; while (o && !o.userData.info) o = o.parent;
  if (!o) { ring.visible = false; return; }
  const info = o.userData.info;
  document.getElementById('d-kind').textContent = info.kind;
  document.getElementById('d-title').textContent = info.title;
  const body = document.getElementById('d-body'); body.replaceChildren();
  for (const [k, v] of info.rows) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; body.append(dt, dd); }
  ring.position.set(o.position.x, LEVEL + 0.03, o.position.z); ring.scale.setScalar(info.small || info.kind === 'Secondary resource' ? 0.22 : 1); ring.visible = true;
});

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h);
}
scrub.max = String(DAY); scrub.step = 'any';
addEventListener('resize', resize); resize(); setMode('route');
document.getElementById('loading').remove();

const timer = new THREE.Clock(); let elapsed = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(timer.getDelta(), 0.05); elapsed += dt;
  if (mode === 'route') stepRoute(dt);
  if (mode === 'orders') {
    if (playing) { minutes = (minutes + dt * (DAY / (DATED ? 180 : 48))) % DAY; scrub.value = String(minutes); }
    placeOrders(minutes);
    for (const o of ORDERS) { o.gem.rotation.y = elapsed * 1.5; o.gem.position.y = 1.5 + Math.sin(elapsed * 2 + o.colour) * 0.12; }
    clock.textContent = clockLabel(minutes);
  }
  for (const id in machines) {
    const m = machines[id], on = m.active > 0;
    m.update(dt, on);
    m.statusMat.emissive.setHex(on ? 0x3ddc84 : 0x5b7a99);
    m.statusMat.emissiveIntensity = on ? 4.5 + Math.sin(elapsed * 6) * 1.2 : 1.0;
    if (m.worker) { m.worker.userData.arms[0].rotation.x = on ? -0.9 + Math.sin(elapsed * 5 + m.pos.x) * 0.35 : 0; m.worker.userData.arms[1].rotation.x = on ? -0.9 + Math.cos(elapsed * 4 + m.pos.x) * 0.35 : 0; }
  }
  for (const s of spinners) s.rotation.z -= dt * 2.2;
  ring.rotation.z += dt * 0.5;
  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
});
</script>
</body>
